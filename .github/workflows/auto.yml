name: Crime Batch B

on:
  schedule:
    - cron: '0 12 * * *'   # 12 PM UTC
    - cron: '0 22 * * *'   # 10 PM UTC
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: python agent.py prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          BATCH_LANGS: "pt,de,ja,ar"
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output

  download:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py download
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output

  build-long:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        lang: [pt, de, ja, ar]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py build
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: long
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output-long-${{ matrix.lang }}
          path: output

  build-short:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        lang: [pt, de, ja, ar]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py build
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: short
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output-short-${{ matrix.lang }}
          path: output

  upload-long:
    needs: build-long
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        lang: [pt, de, ja, ar]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: output-long-${{ matrix.lang }}
          path: output
      - run: python agent.py upload
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: long
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-long-${{ matrix.lang }}
          path: output

  upload-short:
    needs: build-short
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        lang: [pt, de, ja, ar]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: output-short-${{ matrix.lang }}
          path: output
      - run: python agent.py upload
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: short
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-short-${{ matrix.lang }}
          path: output

  comment-reply:
    needs: [upload-long, upload-short]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: uploaded-long-pt
          path: output
        continue-on-error: true
      - run: python agent.py comment
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  ab-test:
    needs: [upload-long, upload-short]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: uploaded-long-pt
          path: output
        continue-on-error: true
      - run: python agent.py abtest
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: python agent.py analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
