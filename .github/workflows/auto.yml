name: Crime Auto

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_langs:
        description: 'Comma-separated lang codes (e.g., en,es,hi) or leave empty for auto'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.pick.outputs.langs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python prepare.py
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_LANGS: ${{ github.event.inputs.force_langs }}
      - id: pick
        run: echo "langs=$(cat output/selected_languages.json)" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: scripts-and-meta
          path: output/

  download-images:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow requests
      - run: python download_images.py
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images/

  build-and-upload:
    runs-on: ubuntu-latest
    needs: [prepare, download-images]
    strategy:
      matrix:
        lang: ${{ fromJson(needs.prepare.outputs.langs) }}
        type: [long, short]
      fail-fast: false  # Don't stop other jobs if one fails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk
      - run: pip install edge-tts Pillow requests google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
      - uses: actions/download-artifact@v4
        with:
          name: scripts-and-meta
          path: output/
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: images/
      - run: mkdir -p temp
      - name: Build video
        id: build
        run: python build_video.py
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: ${{ matrix.type }}
        continue-on-error: true
      - name: Upload to YouTube
        if: steps.build.outcome == 'success'
        run: python upload.py
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: ${{ matrix.type }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
