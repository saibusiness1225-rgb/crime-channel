name: Crime Auto

on:
  schedule:
    - cron: '0 6 * * *'    # 6 AM UTC = 11:30 AM IST
    - cron: '0 12 * * *'   # 12 PM UTC = 5:30 PM IST
    - cron: '0 17 * * *'   # 5 PM UTC = 10:30 PM IST
    - cron: '0 22 * * *'   # 10 PM UTC = 3:30 AM IST
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language code (en, es, hi, fr, pt, de, ja, ar)'
        required: false
        default: 'en'

jobs:
  # ──────────────────────────────────────────────
  # Step 1: Generate scripts & metadata
  # ──────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - run: python agent.py prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output

  # ──────────────────────────────────────────────
  # Step 2: Download images
  # ──────────────────────────────────────────────
  download:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py download
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output

  # ──────────────────────────────────────────────
  # Step 3: Build long videos (matrix: 3 languages)
  # ──────────────────────────────────────────────
  build-long:
    needs: download
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, es, hi]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py build
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: long
      - uses: actions/upload-artifact@v4
        with:
          name: output-long-${{ matrix.lang }}
          path: output

  # ──────────────────────────────────────────────
  # Step 4: Build shorts (matrix: 3 languages)
  # ──────────────────────────────────────────────
  build-short:
    needs: download
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, es, hi]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - uses: actions/download-artifact@v4
        with:
          name: output
          path: output
      - run: python agent.py build
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: short
      - uses: actions/upload-artifact@v4
        with:
          name: output-short-${{ matrix.lang }}
          path: output

  # ──────────────────────────────────────────────
  # Step 5: Upload long videos
  # ──────────────────────────────────────────────
  upload-long:
    needs: build-long
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, es, hi]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: output-long-${{ matrix.lang }}
          path: output
      - run: python agent.py upload
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: long
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ──────────────────────────────────────────────
  # Step 6: Upload shorts
  # ──────────────────────────────────────────────
  upload-short:
    needs: build-short
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lang: [en, es, hi]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: output-short-${{ matrix.lang }}
          path: output
      - run: python agent.py upload
        env:
          LANG_CODE: ${{ matrix.lang }}
          VIDEO_TYPE: short
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ──────────────────────────────────────────────
  # Step 7: Auto-reply to comments
  # ──────────────────────────────────────────────
  comment-reply:
    needs: [upload-long, upload-short]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python agent.py comment
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  # ──────────────────────────────────────────────
  # Step 8: A/B title testing + analytics
  # ──────────────────────────────────────────────
  ab-test:
    needs: [upload-long, upload-short]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python agent.py abtest
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: python agent.py analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
