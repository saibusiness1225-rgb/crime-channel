name: 🎬 Crime Channel Automation
on:
  schedule:
    # 3 Long-form documentaries per week (Mon, Wed, Fri at 06:00 UTC)
    - cron: '0 6 * * 1,3,5'
    # 4 Shorts per week (Tue, Thu, Sat, Sun at 08:00 UTC)
    - cron: '0 8 * * 2,4,6,0'
  
  # Allow manual runs from GitHub UI
  workflow_dispatch:
    inputs:
      langs:
        description: 'Comma-separated languages (e.g. en)'
        required: false
        default: 'en'

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Kill whole workflow if stuck for 3 hours
    
    env:
      # These are pulled from GitHub Secrets
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # <-- ADDED THIS LINE
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      BATCH_LANGS: ${{ inputs.langs || 'en' }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🧠 Prepare Scripts & Metadata
        run: python agent.py prepare

      - name: 🎥 Build & Upload Loop
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          echo "=========================================="
          echo "Starting Sequential Build & Upload Loop"
          echo "=========================================="
          
          IFS=',' read -ra LANG_ARRAY <<< "$BATCH_LANGS"
          TYPES=("long" "short")
          
          TOTAL_SUCCESS=0
          TOTAL_FAIL=0
          
          for LANG in "${LANG_ARRAY[@]}"; do
            LANG=$(echo "$LANG" | xargs)
            
            for TYPE in "${TYPES[@]}"; do
              echo ""
              echo "##############################################"
              echo "# PROCESSING: $LANG | $TYPE"
              echo "##############################################"
              
              export LANG_CODE="$LANG"
              export VIDEO_TYPE="$TYPE"
              
              if python agent.py build; then
                if python agent.py upload; then
                  echo "✅ SUCCESS: $LANG $TYPE uploaded!"
                  TOTAL_SUCCESS=$((TOTAL_SUCCESS + 1))
                else
                  echo "❌ FAILED: $LANG $TYPE upload failed (Likely YouTube Quota exceeded)."
                  TOTAL_FAIL=$((TOTAL_FAIL + 1))
                fi
              else
                echo "❌ FAILED: $LANG $TYPE build failed. Skipping upload."
                TOTAL_FAIL=$((TOTAL_FAIL + 1))
              fi
              
            done
          done
          
          echo ""
          echo "=========================================="
          echo "FINAL REPORT"
          echo "=========================================="
          echo "Successes: $TOTAL_SUCCESS"
          echo "Failures:  $TOTAL_FAIL"
          
          if [ "$TOTAL_SUCCESS" -gt 0 ]; then
            exit 0
          else
            exit 1
          fi
