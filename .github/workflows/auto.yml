name: Crime Auto - OPTIMIZED

on:
  schedule:
    # Multiple posting times throughout the day for maximum reach
    - cron: '0 6 * * *'    # 6 AM UTC = 11:30 AM IST (Morning audience)
    - cron: '0 12 * * *'   # 12 PM UTC = 5:30 PM IST (Afternoon audience)
    - cron: '0 17 * * *'   # 5 PM UTC = 10:30 PM IST (Prime time)
    - cron: '0 22 * * *'   # 10 PM UTC = 3:30 AM IST (Night owls / US audience)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: PREPARE (Generate scripts + SEO metadata)
  # ==========================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg & System Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Run Prepare Script
        id: run-prepare
        run: python prepare.py
        continue-on-error: true

      - name: Create Safety Files
        run: |
          mkdir -p output/scripts
          mkdir -p output/metadata
          mkdir -p output/analytics
          mkdir -p analytics

          if [ ! -f output/selected_languages.json ]; then
            echo '["en"]' > output/selected_languages.json
          fi
          if [ ! -f output/scripts/long_en.txt ]; then
            echo "Test script content. The prepare script likely failed to generate the real one." > output/scripts/long_en.txt
          fi
          if [ ! -f output/metadata/all.json ]; then
            echo '{"en":{"long":{"title":"True Crime Mystery","description":"","tags":[],"pinned_comment":"","category":"","title_b":""}}}' > output/metadata/all.json
          fi

          echo '{"status":"prepared"}' > output/analytics-data.json

      - name: Set Matrix Output
        id: set-matrix
        run: |
          LIST=$(cat output/selected_languages.json)
          echo "matrix={\"code\":$LIST}" >> $GITHUB_OUTPUT

      - name: Upload Scripts & Metadata
        uses: actions/upload-artifact@v4
        with:
          name: crime-scripts
          path: output/

      - name: Upload Analytics Data
        uses: actions/upload-artifact@v4
        with:
          name: analytics-data
          path: output/analytics-data.json

  # ==========================================
  # JOB 2: BUILD VIDEO (High quality, no black screens)
  # ==========================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          pip install numpy

      - name: Download Scripts & Metadata
        uses: actions/download-artifact@v4
        with:
          name: crime-scripts
          path: output

      - name: Download Images
        run: python downloadimages.py

      - name: Build Video (Long)
        env:
          LANG_CODE: ${{ matrix.code }}
          VIDEO_TYPE: long
        run: python build.py

      - name: Upload Long Video to YouTube
        env:
          LANG_CODE: ${{ matrix.code }}
          VIDEO_TYPE: long
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload.py

      - name: Build Video (Short)
        env:
          LANG_CODE: ${{ matrix.code }}
          VIDEO_TYPE: short
        run: python build.py

      - name: Upload Short Video to YouTube
        env:
          LANG_CODE: ${{ matrix.code }}
          VIDEO_TYPE: short
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload.py

  # ==========================================
  # JOB 3: COMMENT REPLY (Engagement booster)
  # ==========================================
  comment-reply:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Analytics
        uses: actions/download-artifact@v4
        with:
          name: analytics-data
          path: output

      - name: Run Comment Reply
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python comment_reply.py

  # ==========================================
  # JOB 4: ANALYTICS & A/B TESTING
  # ==========================================
  analytics-and-ab:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Download Analytics
        uses: actions/download-artifact@v4
        with:
          name: analytics-data
          path: output

      - name: Run Analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python analytics.py

      - name: Run A/B Testing
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python ab_testing.py
